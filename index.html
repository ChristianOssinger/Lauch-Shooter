<title>Lauch Attack!</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;}
  #warn{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.9);border:3px solid #ff4444;border-radius:16px;
    padding:24px 32px;text-align:center;z-index:99;font-family:sans-serif;color:#fff;
    animation:pulse 0.5s ease infinite alternate;}
  @keyframes pulse{from{box-shadow:0 0 15px #f00;}to{box-shadow:0 0 40px #f00;}}
  #warn h2{color:#ff4444;font-size:1.6rem;margin-bottom:8px;}
  #warn p{font-size:1rem;line-height:1.6;}
  #warn #cd{font-size:2.5rem;color:#ffe44d;margin-top:8px;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="startOverlay" style="
  display:flex;position:fixed;inset:0;z-index:50;
  align-items:center;justify-content:center;">
  <button id="startBtn" onclick="startGame()" style="
    padding:20px 50px;font-size:1.5rem;font-weight:bold;
    background:#c0392b;color:#fff;border:none;border-radius:40px;
    box-shadow:0 6px 20px rgba(0,0,0,0.5);cursor:pointer;
    font-family:sans-serif;letter-spacing:0.1em;
    -webkit-tap-highlight-color:transparent;">
    &#x1F3AF; LOS GEHTS!
  </button>
</div>
<div id="warn">
  <h2>&#x26A1; ACHTUNG! &#x26A1;</h2>
  <p>Du hast <strong style="color:#ffe44d">Level 4</strong> geschafft!<br>
  Ab jetzt kann der Lauch-Man<br>
  <strong style="color:#ff4444">TELEPORTIEREN!</strong></p>
  <div id="cd">3</div>
</div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const GW=640,GH=480;
canvas.width=GW; canvas.height=GH;

function resize(){
  const s=Math.min(window.innerWidth/GW, window.innerHeight/GH);
  canvas.style.width=Math.floor(GW*s)+'px';
  canvas.style.height=Math.floor(GH*s)+'px';
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,200));
resize();

// Monster Bild + BG entfernen
let monsterCanvas=null;
const monsterImg=new Image();
monsterImg.onload=()=>{
  const oc=document.createElement('canvas');
  oc.width=monsterImg.naturalWidth; oc.height=monsterImg.naturalHeight;
  const ox=oc.getContext('2d'); ox.drawImage(monsterImg,0,0);
  const id=ox.getImageData(0,0,oc.width,oc.height),d=id.data;
  for(let i=0;i<d.length;i+=4){
    const br=(d[i]+d[i+1]+d[i+2])/3;
    if(br<40)d[i+3]=0; else if(br<80)d[i+3]=Math.round((br-40)/40*255);
  }
  ox.putImageData(id,0,0); monsterCanvas=oc;
};

// Polyfill
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(w<2*r)r=w/2;if(h<2*r)r=h/2;
    this.beginPath();this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);
    this.closePath();return this;
  };
}

let cannon,monster,balls,particles,score,lives,level,running,frameCount,keys,tpWarn;

function startGame(){
  document.getElementById('startOverlay').style.display='none';
  resetGame();
  running=true;
  requestAnimationFrame(gameLoop);
}
function showGameOver(){
  document.getElementById('startOverlay').style.display='flex';
  document.getElementById('startBtn').textContent='🔄 Nochmal!';
}
function resetGame(){
  cannon={x:70,y:GH-80,angle:-Math.PI/4,cooldown:0};
  monster={x:GW-160,y:GH/2-90,vx:0,vy:0,w:100,h:165,
    hp:3,maxHp:3,speed:0.6,knockback:0,
    hitFlash:0,dangerFlash:0,dead:false,deathTimer:0,
    telePhase:0,teleAlpha:1};
  balls=[];particles=[];score=0;lives=3;level=1;
  frameCount=0;keys={};tpWarn=false;
}

function getPos(cx,cy){
  const r=canvas.getBoundingClientRect();
  return{x:(cx-r.left)*(GW/r.width),y:(cy-r.top)*(GH/r.height)};
}

document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();fireBall();}});
document.addEventListener('keyup',e=>{keys[e.key]=false;});
canvas.addEventListener('mousemove',e=>{if(!running)return;const p=getPos(e.clientX,e.clientY);setAngle(p.x,p.y);});
canvas.addEventListener('click',()=>{if(running)fireBall();});
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(!running)return;
  const p=getPos(e.touches[0].clientX,e.touches[0].clientY);
  setAngle(p.x,p.y);
},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!running)return;const p=getPos(e.touches[0].clientX,e.touches[0].clientY);setAngle(p.x,p.y);},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();if(running)fireBall();},{passive:false});

function setAngle(x,y){
  cannon.angle=Math.atan2(y-cannon.y,x-cannon.x);
  cannon.angle=Math.max(-Math.PI+0.05,Math.min(-0.05,cannon.angle));
}

function fireBall(){
  if(cannon.cooldown>0)return;
  const spd=10,tx=cannon.x+Math.cos(cannon.angle)*55,ty=cannon.y+Math.sin(cannon.angle)*55;
  balls.push({x:tx,y:ty,vx:Math.cos(cannon.angle)*spd,vy:Math.sin(cannon.angle)*spd,r:10,g:0.18});
  cannon.cooldown=18;
  for(let i=0;i<8;i++)particles.push({x:tx,y:ty,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:15,maxLife:15,r:Math.random()*5+2,color:'hsl('+(Math.random()*40+20)+',100%,60%)'});
}

function spawnHit(x,y){for(let i=0;i<18;i++)particles.push({x,y,vx:(Math.random()-.5)*12,vy:Math.random()*12-8,life:30,maxLife:30,r:Math.random()*7+3,color:['#2ecc71','#f1c40f','#e74c3c','#fff'][Math.floor(Math.random()*4)]});}
function spawnDeath(x,y){for(let i=0;i<40;i++)particles.push({x,y,vx:(Math.random()-.5)*20,vy:Math.random()*20-15,life:60,maxLife:60,r:Math.random()*12+4,color:['#2ecc71','#f1c40f','#e74c3c','#9b59b6','#fff'][Math.floor(Math.random()*5)]});}

function doTeleport(){if(monster.telePhase!==0)return;monster.telePhase=1;}

function showTpWarning(){
  running=false;
  const el=document.getElementById('warn'),cd=document.getElementById('cd');
  el.style.display='block';let n=3;
  const t=setInterval(()=>{n--;if(n<=0){clearInterval(t);el.style.display='none';running=true;requestAnimationFrame(gameLoop);}else cd.textContent=n;},1000);
}

function respawn(){
  monster.x=GW-160;monster.y=GH/2-90;monster.vx=0;monster.vy=0;
  monster.hp=monster.maxHp;monster.knockback=0;monster.hitFlash=0;
  monster.dead=false;monster.deathTimer=0;monster.telePhase=0;monster.teleAlpha=1;
}

function gameLoop(){
  if(!running)return;
  frameCount++;
  if(keys['a']||keys['ArrowLeft'])cannon.angle=Math.max(-Math.PI+0.05,cannon.angle-0.03);
  if(keys['d']||keys['ArrowRight'])cannon.angle=Math.min(-0.05,cannon.angle+0.03);
  if(cannon.cooldown>0)cannon.cooldown--;

  if(frameCount%800===0){
    level++;monster.speed+=0.15;monster.maxHp=Math.min(monster.maxHp+1,8);
    if(monster.dead)respawn();
    if(level===5&&!tpWarn){tpWarn=true;showTpWarning();}
  }

  if(level>=5&&!monster.dead&&monster.knockback<=0&&monster.telePhase===0){
    if(frameCount%80===0)doTeleport();
    const mx=monster.x+monster.w/2,my=monster.y+monster.h/2;
    for(const b of balls){const dx=b.x-mx,dy=b.y-my;if(Math.sqrt(dx*dx+dy*dy)<90&&Math.random()<0.6){doTeleport();break;}}
  }

  if(monster.telePhase===1){
    monster.teleAlpha-=0.15;
    if(monster.teleAlpha<=0){
      monster.teleAlpha=0;let nx,ny,tr=0;
      do{nx=Math.random()*(GW-monster.w-20)+10;ny=Math.random()*(GH-monster.h-60)+10;tr++;}
      while(Math.sqrt(Math.pow(nx-cannon.x,2)+Math.pow(ny-cannon.y,2))<200&&tr<20);
      monster.x=nx;monster.y=ny;monster.telePhase=2;
    }
  }else if(monster.telePhase===2){monster.teleAlpha+=0.12;if(monster.teleAlpha>=1){monster.teleAlpha=1;monster.telePhase=0;}}

  if(!monster.dead){
    if(monster.knockback>0){
      monster.x+=monster.vx;monster.y+=monster.vy;monster.vy+=0.3;monster.knockback--;
      if(monster.x>GW-monster.w-10){monster.x=GW-monster.w-10;monster.vx*=-0.5;}
      if(monster.x<GW/2){monster.x=GW/2;monster.vx=Math.abs(monster.vx)*0.5;}
      if(monster.y<0){monster.y=0;monster.vy=Math.abs(monster.vy)*0.5;}
      if(monster.y>GH-monster.h){monster.y=GH-monster.h;monster.vy=0;}
    }else if(monster.telePhase===0){
      const dx=cannon.x-(monster.x+monster.w/2),dy=cannon.y-(monster.y+monster.h/2);
      const d=Math.sqrt(dx*dx+dy*dy)||1,spd=monster.speed+level*0.08;
      monster.x+=(dx/d)*spd;monster.y+=(dy/d)*spd;
    }
    if(monster.hitFlash>0)monster.hitFlash--;
    if(monster.dangerFlash>0)monster.dangerFlash--;
    if(monster.x<cannon.x+55&&monster.x+monster.w>cannon.x-55&&monster.y<cannon.y+55&&monster.y+monster.h>cannon.y-55){
      lives--;spawnDeath(cannon.x,cannon.y);respawn();
      if(lives<=0){gameOver();return;}
    }
    const dd=Math.sqrt(Math.pow(monster.x+monster.w/2-cannon.x,2)+Math.pow(monster.y+monster.h/2-cannon.y,2));
    if(dd<200)monster.dangerFlash=5;
  }else{monster.deathTimer++;if(monster.deathTimer>80)respawn();}

  balls=balls.filter(b=>{
    b.vy+=b.g;b.x+=b.vx;b.y+=b.vy;
    if(!monster.dead&&monster.telePhase===0&&b.x+b.r>monster.x&&b.x-b.r<monster.x+monster.w&&b.y+b.r>monster.y&&b.y-b.r<monster.y+monster.h){
      monster.hp--;score+=10*level;monster.hitFlash=12;spawnHit(b.x,b.y);
      const kx=(monster.x+monster.w/2)-cannon.x,ky=(monster.y+monster.h/2)-cannon.y,kd=Math.sqrt(kx*kx+ky*ky)||1;
      monster.vx=(kx/kd)*14;monster.vy=(ky/kd)*14-6;monster.knockback=30;
      if(monster.hp<=0){monster.dead=true;monster.deathTimer=0;score+=50*level;spawnDeath(monster.x+monster.w/2,monster.y+monster.h/2);}
      return false;
    }
    return b.x>-20&&b.x<GW+20&&b.y<GH+20&&b.y>-300;
  });
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life--;return p.life>0;});
  if(frameCount%60===0)score++;
  draw();
  requestAnimationFrame(gameLoop);
}

function draw(){
  const sky=ctx.createLinearGradient(0,0,0,GH);
  sky.addColorStop(0,'#4fc3f7');sky.addColorStop(1,'#a5d6a7');
  ctx.fillStyle=sky;ctx.fillRect(0,0,GW,GH);

  ctx.fillStyle='rgba(255,255,255,0.55)';
  [[60,40,50,25],[200,55,42,22],[420,35,55,28],[550,50,38,20]].forEach(([x,y,w,h])=>{
    ctx.beginPath();ctx.ellipse(x,y,w,h,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+20,y-8,w*.7,h*.8,0,0,Math.PI*2);ctx.fill();
  });

  ctx.fillStyle='#5d9e4f';ctx.fillRect(0,GH-50,GW,50);
  ctx.fillStyle='#3d7a32';ctx.fillRect(0,GH-56,GW,12);

  ctx.save();ctx.setLineDash([10,8]);
  ctx.strokeStyle='rgba(255,50,50,0.3)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(cannon.x+90,0);ctx.lineTo(cannon.x+90,GH);ctx.stroke();
  ctx.restore();
  ctx.fillStyle='rgba(255,50,50,0.05)';ctx.fillRect(0,0,cannon.x+90,GH);

  particles.forEach(p=>{ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;

  // Monster
  ctx.save();
  if(monster.dead){
    ctx.translate(monster.x+monster.w/2,monster.y+monster.h/2);
    ctx.rotate(monster.deathTimer*0.15);
    ctx.translate(-monster.w/2,-monster.h/2);
    ctx.globalAlpha=Math.max(0,1-monster.deathTimer/80);
  }else{ctx.globalAlpha=monster.teleAlpha;}
  if(monster.hitFlash>0&&monster.hitFlash%4<2)ctx.filter='brightness(3) saturate(0)';
  else if(monster.dangerFlash>0&&monster.dangerFlash%3<2)ctx.filter='brightness(1.4) hue-rotate(300deg)';
  else ctx.filter='none';
  if(monsterCanvas)ctx.drawImage(monsterCanvas,monster.x,monster.y,monster.w,monster.h);
  else{ctx.fillStyle='#2ecc71';ctx.fillRect(monster.x,monster.y,monster.w,monster.h);}
  ctx.filter='none';ctx.globalAlpha=1;ctx.restore();

  if(!monster.dead&&monster.teleAlpha>0.3){
    const bx=monster.x,by=monster.y-16,bw=monster.w,bh=9;
    ctx.globalAlpha=monster.teleAlpha;
    ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,4);ctx.fill();
    const pct=monster.hp/monster.maxHp;
    ctx.fillStyle=pct>0.5?'#2ecc71':pct>0.25?'#f1c40f':'#e74c3c';
    ctx.beginPath();ctx.roundRect(bx,by,bw*pct,bh,4);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 8px sans-serif';ctx.textAlign='center';
    ctx.fillText(monster.hp+'/'+monster.maxHp,bx+bw/2,by+bh-1);
    ctx.globalAlpha=1;
  }

  // Kanone
  ctx.save();ctx.translate(cannon.x,cannon.y);
  ctx.fillStyle='#4a3728';
  [-16,16].forEach(ox=>{
    ctx.beginPath();ctx.arc(ox,22,17,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#2c1a0e';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(ox,22,17,0,Math.PI*2);ctx.stroke();
    [0,1,2,3].forEach(i=>{const a=i*Math.PI/2;ctx.beginPath();ctx.moveTo(ox,22);ctx.lineTo(ox+Math.cos(a)*15,22+Math.sin(a)*15);ctx.stroke();});
  });
  const bg=ctx.createLinearGradient(-30,-10,30,10);
  bg.addColorStop(0,'#8B4513');bg.addColorStop(1,'#5C3317');
  ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(-35,-8,70,22,5);ctx.fill();
  ctx.strokeStyle='#3d1f0a';ctx.lineWidth=2;ctx.stroke();
  ctx.save();ctx.rotate(cannon.angle);
  const tg=ctx.createLinearGradient(0,-12,0,12);
  tg.addColorStop(0,'#888');tg.addColorStop(.5,'#ccc');tg.addColorStop(1,'#666');
  ctx.fillStyle=tg;ctx.beginPath();ctx.roundRect(0,-10,55,20,4);ctx.fill();
  ctx.strokeStyle='#444';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#555';ctx.beginPath();ctx.roundRect(48,-12,12,24,3);ctx.fill();
  ctx.restore();ctx.restore();

  balls.forEach(b=>{
    ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(b.x,GH-43,b.r*.7,b.r*.25,0,0,Math.PI*2);ctx.fill();
    const kg=ctx.createRadialGradient(b.x-3,b.y-3,1,b.x,b.y,b.r);
    kg.addColorStop(0,'#aaa');kg.addColorStop(1,'#222');
    ctx.fillStyle=kg;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
  });

  ctx.strokeStyle='rgba(255,255,100,.5)';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);
  let px=cannon.x+Math.cos(cannon.angle)*58,py=cannon.y+Math.sin(cannon.angle)*58;
  let pvx=Math.cos(cannon.angle)*10,pvy=Math.sin(cannon.angle)*10;
  ctx.beginPath();ctx.moveTo(px,py);
  for(let i=0;i<14;i++){pvy+=0.18;px+=pvx;py+=pvy;ctx.lineTo(px,py);}
  ctx.stroke();ctx.setLineDash([]);

  // HUD
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.beginPath();ctx.roundRect(6,6,GW-12,32,8);ctx.fill();
  ctx.font='bold 14px sans-serif';ctx.fillStyle='#ffe44d';ctx.textAlign='left';
  ctx.fillText('Lauch Attack', 14, 26);
  ctx.textAlign='center';ctx.fillStyle='#ff6b6b';
  ctx.fillText('\u2764\uFE0F'.repeat(Math.max(lives,0)),GW/2,26);
  ctx.textAlign='right';ctx.fillStyle='#fff';
  ctx.fillText('Pts:'+score+'  Lvl:'+level,GW-14,26);
}

function drawOverlay(title,lines,btn){
  ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(0,0,GW,GH);
  ctx.textAlign='center';
  ctx.font='bold 52px sans-serif';ctx.fillStyle='#ff4444';ctx.fillText(title,GW/2,GH/2-90);
  ctx.font='17px sans-serif';ctx.fillStyle='#eee';
  lines.forEach((l,i)=>ctx.fillText(l,GW/2,GH/2-30+i*30));
  ctx.fillStyle='#c0392b';ctx.beginPath();ctx.roundRect(GW/2-100,GH/2+75,200,50,25);ctx.fill();
  ctx.font='bold 22px sans-serif';ctx.fillStyle='#fff';ctx.fillText(btn,GW/2,GH/2+107);
}

function showStart(){
  draw();
  drawOverlay('Lauch Attack!',
    ['Schiess den Lauch-Man ab!','Maus/Touch = zielen  |  Klick/Tap = schiessen','A/D Pfeile = drehen  |  Leertaste = schiessen'],
    'LOS GEHTS!');
}

function gameOver(){
  running=false;
  draw();
  drawOverlay('GAME OVER',['Der Lauch hat gewonnen...','Score: '+score],'');
  showGameOver();
}

resetGame();
showStart();
</script>
